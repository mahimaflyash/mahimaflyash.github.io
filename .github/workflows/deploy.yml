name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Pages are prerendered to static HTML (SSG). Unknown URLs get the client-rendered app, which shows "Page not found"
      - name: Add 404 fallback
        run: cp dist/mahima-fly-ash-bricks/browser/index.csr.html dist/mahima-fly-ash-bricks/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mahima-fly-ash-bricks/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
