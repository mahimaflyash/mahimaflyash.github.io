@if (status() === 'sent') {
  <div class="form-result form-result--ok" role="status">
    <app-icon name="check" [size]="32" />
    <h3>Thank you! Your enquiry has been sent.</h3>
    <p>We will contact you soon. For a quicker reply, call or WhatsApp us.</p>
    <button type="button" class="btn btn--outline" (click)="status.set('idle')">Send another enquiry</button>
  </div>
} @else {
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form__row">
      <label class="field">
        <span>Your name *</span>
        <input type="text" formControlName="name" autocomplete="name" [class.is-invalid]="invalid('name')" />
        @if (invalid('name')) {
          <small class="field__error">Please enter your name.</small>
        }
      </label>
      <label class="field">
        <span>Phone number *</span>
        <input type="tel" formControlName="phone" autocomplete="tel" inputmode="tel" [class.is-invalid]="invalid('phone')" />
        @if (invalid('phone')) {
          <small class="field__error">Please enter a valid phone number.</small>
        }
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span>Email (optional)</span>
        <input type="email" formControlName="email" autocomplete="email" [class.is-invalid]="invalid('email')" />
        @if (invalid('email')) {
          <small class="field__error">Please enter a valid email.</small>
        }
      </label>
      <label class="field">
        <span>Product</span>
        <select formControlName="product">
          <option value="">Select a product</option>
          @for (p of products; track p.id) {
            <option [value]="p.name">{{ p.name }}</option>
          }
          <option value="Other">Other / Not sure</option>
        </select>
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span>Quantity</span>
        <input type="text" formControlName="quantity" placeholder="e.g. 5000 bricks" />
      </label>
      <label class="field">
        <span>Site location</span>
        <input type="text" formControlName="location" placeholder="Village / Town" />
      </label>
    </div>

    <label class="field">
      <span>Message</span>
      <textarea rows="4" formControlName="message" placeholder="Tell us what you need"></textarea>
    </label>

    <input type="checkbox" formControlName="botcheck" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true" />

    @if (status() === 'error') {
      <div class="form-result form-result--error" role="alert">
        <p>{{ errorMessage() }}</p>
        <a class="btn btn--whatsapp" [href]="whatsappFallback()" target="_blank" rel="noopener">
          <app-icon name="whatsapp" /> Send on WhatsApp
        </a>
      </div>
    }

    <div class="form__actions">
      <button type="submit" class="btn btn--primary" [disabled]="status() === 'sending'">
        <app-icon name="mail" /> {{ status() === 'sending' ? 'Sending…' : 'Send Enquiry' }}
      </button>
      <a class="btn btn--whatsapp" [href]="whatsappFallback()" target="_blank" rel="noopener">
        <app-icon name="whatsapp" /> Enquire on WhatsApp
      </a>
    </div>
  </form>
}
